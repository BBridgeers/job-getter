# Portal Scanner Configuration — Blake's Job Getter Bot
# Targets: CSE, Account Manager, Implementation Consultant, Client Partner, Strategic Account Exec
# Geography: DFW + Remote (US)

# ─────────────────────────────────────────────────────────
# SEARCH QUERIES — web_search with site: filters for broad discovery
# ─────────────────────────────────────────────────────────
search_queries:
  # ── Greenhouse-hosted companies ──
  - query: 'site:boards.greenhouse.io "Customer Success" "Dallas" OR "Remote" OR "Texas"'
    name: "Greenhouse — CSE DFW/Remote"
    enabled: true
  - query: 'site:boards.greenhouse.io "Account Manager" "Client Partner" "Dallas" OR "Remote"'
    name: "Greenhouse — AM/CP DFW/Remote"
    enabled: true
  - query: 'site:boards.greenhouse.io "Implementation Consultant" "Customer Success" "Remote"'
    name: "Greenhouse — Implementation/CS Remote"
    enabled: true
  - query: 'site:boards.greenhouse.io "Strategic Account" "Customer Success" "Texas" OR "Remote"'
    name: "Greenhouse — Strategic Account TX/Remote"
    enabled: true

  # ── Ashby-hosted companies ──
  - query: 'site:jobs.ashbyhq.com "Customer Success" "Dallas" OR "Remote" OR "Texas"'
    name: "Ashby — CSE DFW/Remote"
    enabled: true
  - query: 'site:jobs.ashbyhq.com "Account Manager" "Client Partner" "Dallas" OR "Remote"'
    name: "Ashby — AM/CP DFW/Remote"
    enabled: true

  # ── Lever-hosted companies ──
  - query: 'site:jobs.lever.co "Customer Success" "Dallas" OR "Remote" OR "Texas"'
    name: "Lever — CSE DFW/Remote"
    enabled: true
  - query: 'site:jobs.lever.co "Account Manager" "Implementation" "Dallas" OR "Remote"'
    name: "Lever — AM/Impl DFW/Remote"
    enabled: true

  # ── LinkedIn Jobs ──
  - query: 'site:linkedin.com/jobs "Customer Success Executive" "Dallas-Fort Worth" OR "Remote"'
    name: "LinkedIn — CSE DFW/Remote"
    enabled: true
  - query: 'site:linkedin.com/jobs "Account Manager" "Client Partner" "Dallas-Fort Worth" OR "Remote"'
    name: "LinkedIn — AM/CP DFW/Remote"
    enabled: true
  - query: 'site:linkedin.com/jobs "Implementation Consultant" "Dallas-Fort Worth" OR "Remote"'
    name: "LinkedIn — Implementation DFW/Remote"
    enabled: true

  # ── Indeed ──
  - query: 'site:indeed.com "Customer Success" "Account Manager" "Dallas" OR "Remote" "Texas"'
    name: "Indeed — CS/AM Dallas/Remote"
    enabled: true
  - query: 'site:indeed.com "Client Partner" "Strategic Account" "Dallas" OR "Remote"'
    name: "Indeed — Client Partner/Strategic Dallas/Remote"
    enabled: true

  # ── Built In (startup/scaleup focused) ──
  - query: 'site:builtinaustin.com OR site:builtindallas.com "Customer Success" "Account Manager"'
    name: "Built In — CS/AM Austin/Dallas"
    enabled: true

  # ── General broad searches ──
  - query: '"Customer Success Executive" "Dallas" OR "DFW" OR "Remote" 2026'
    name: "General — CSE DFW/Remote 2026"
    enabled: true
  - query: '"Client Success Manager" "Account Manager" "Dallas" OR "Remote" "SaaS" 2026'
    name: "General — CSM/AM SaaS DFW/Remote"
    enabled: true

