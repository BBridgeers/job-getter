# ─────────────────────────────────────────────────────────
# TITLE FILTER — which job titles pass the filter
# ─────────────────────────────────────────────────────────
title_filter:
  positive:
    - "customer success"
    - "account manager"
    - "account executive"
    - "client partner"
    - "client success"
    - "implementation consultant"
    - "implementation manager"
    - "strategic account"
    - "customer advocate"
    - "customer experience"
    - "client relations"
    - "account director"
    - "customer success director"
    - "VP customer success"
    - "head of customer success"
    - "director of customer success"
    - "senior account manager"
    - "principal account manager"
    - "enterprise account"
    - "technology consultant"
    - "solutions consultant"
    - "customer operations"
    - "revenue operations"
    - "client onboarding"
    - "digital transformation"
    - "adoption specialist"
    - "enablement manager"

  negative:
    - "intern"
    - "junior"
    - "entry level"
    - "associate"
    - "part-time"
    - "contract"
    - "temporary"
    - "summer"
    - "co-op"
    - "fellow"
    - "apprentice"
    - "volunteer"
    - "unpaid"

  seniority_boost:
    - "senior"
    - "lead"
    - "principal"
    - "staff"
    - "manager"
    - "director"
    - "head"
    - "vp"
    - "vice president"
    - "executive"
    - "chief"

# ─────────────────────────────────────────────────────────
# LOCATION FILTER
# ─────────────────────────────────────────────────────────
location_filter:
  allow:
    - "dallas"
    - "fort worth"
    - "dfw"
    - "texas"
    - "tx"
    - "remote"
    - "united states"
    - "us"
    - "usa"
    - "anywhere"
    - "home"
    - "virtual"
  block:
    - "san francisco"
    - "new york"
    - "seattle"
    - "boston"
    - "chicago"
    - "los angeles"
    - "washington dc"
    - "london"
    - "berlin"
    - "amsterdam"
    - "relocation required"